name: Build Windows Installer

on:
  push:
    branches: [main, migration/rust-tauri-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate a valid Windows icon from the supplied Crescent logo
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/repair-windows-icon.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Build Tauri application
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Crescent-Client-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  build-fabric-mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crescent-fabric
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Build Crescent Fabric JAR
        run: gradle --no-daemon clean build

      - name: Upload Crescent Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: Crescent-Fabric-26.3
          path: crescent-fabric/build/libs/crescent-client-0.1.0.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish Crescent 26.3 mod release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: crescent-26.3
          name: Crescent Client Mod for Minecraft 26.3
          body: Automated Crescent Fabric mod build for Minecraft 26.3.
          files: crescent-fabric/build/libs/crescent-client-0.1.0.jar
          overwrite_files: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
